name: News Phi fresh-news regressions
on:
  push:
    branches: [main]
  pull_request:
jobs:
  news-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify news-only stream, freshness and safety
        run: |
          node --check news-phi-core.js
          node --check news-phi-cloud.js
          node --check workers/news-phi-feed/worker.js
          node --test test/storybook-collections.test.cjs
